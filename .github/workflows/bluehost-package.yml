name: Bluehost package

# Builds clinic-server.zip (Laravel backend + built website) to upload to Bluehost. See backend/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SITE_URL=https://drkhaledsalah.com npm run package:server
      - uses: actions/upload-artifact@v4
        with:
          name: clinic-server
          path: clinic-server.zip
          retention-days: 30
